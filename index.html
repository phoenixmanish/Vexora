<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vexora — Intelligent Vector Search Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #0a0a14;
  --card:   #0f0f1e;
  --border: #1a1a2e;
  --accent: #6c5ce7;
  --primary: #00d9ff;
  --success: #26de81;
  --warning: #ffa502;
  --error: #ee5a6f;
  --text-primary: #e8eef7;
  --text-secondary: #7d8494;
  --text-tertiary: #525870;
  --glow: rgba(108, 92, 231, 0.2);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: 'Inter', 'Fira Code', 'Courier New', monospace;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  line-height: 1.5;
}

/* ── HEADER ── */
header {
  background: linear-gradient(180deg, rgba(15, 15, 30, 0.8), rgba(15, 15, 30, 0.6));
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(10px);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
}

header h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(90deg, var(--primary), var(--accent), #b388ff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: 'Inter', sans-serif;
  text-shadow: 0 0 30px rgba(0, 217, 255, 0.1);
}

header h1::after {
  content: " • Intelligent Vector Database";
  -webkit-text-fill-color: var(--text-secondary);
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 1px;
  margin-left: 12px;
}

.badge {
  font-size: 10px;
  padding: 5px 11px;
  border-radius: 20px;
  letter-spacing: 1px;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  background: rgba(26, 26, 46, 0.5);
  font-weight: 500;
  text-transform: uppercase;
  transition: all 0.3s ease;
}

.badge.hl {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(108, 92, 231, 0.15);
  box-shadow: 0 0 12px rgba(108, 92, 231, 0.2);
}

.badge.ok {
  border-color: var(--success);
  color: var(--success);
  background: rgba(38, 222, 129, 0.12);
}

.badge.err {
  border-color: var(--error);
  color: var(--error);
  background: rgba(238, 90, 111, 0.12);
}

.badge:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
}

#statsLabel {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-secondary);
  font-family: 'Fira Code', monospace;
  letter-spacing: 0.5px;
}

/* ── LAYOUT ── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  gap: 0;
}

.left-panel {
  width: 280px;
  flex-shrink: 0;
  background: linear-gradient(180deg, rgba(15, 15, 30, 0.8), rgba(10, 10, 20, 0.9));
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.center-panel {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(15, 15, 30, 0.5), rgba(10, 10, 20, 0.7));
}

#scatter {
  display: block;
  width: 100%;
  height: 100%;
}

.right-panel {
  width: 380px;
  flex-shrink: 0;
  background: linear-gradient(180deg, rgba(15, 15, 30, 0.8), rgba(10, 10, 20, 0.9));
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: -4px 0 16px rgba(0, 0, 0, 0.3);
}

/* ── TABS ── */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.tab {
  flex: 1;
  padding: 12px 8px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  transition: all 0.3s ease;
  text-transform: uppercase;
  font-weight: 500;
}

.tab:hover {
  color: var(--text-primary);
  background: rgba(108, 92, 231, 0.08);
}

.tab.on {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: rgba(108, 92, 231, 0.1);
}

.tab-content {
  display: none;
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  flex-direction: column;
  gap: 18px;
}

.tab-content.on {
  display: flex;
}

/* ── COMMON COMPONENTS ── */
.sec {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin-bottom: 10px;
  font-weight: 600;
}

input[type=text], select, textarea {
  width: 100%;
  background: rgba(26, 26, 46, 0.4);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 10px 13px;
  border-radius: 8px;
  font-family: 'Fira Code', monospace;
  font-size: 12px;
  outline: none;
  transition: all 0.3s ease;
}

input[type=text]:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  background: rgba(108, 92, 231, 0.1);
  box-shadow: 0 0 16px rgba(108, 92, 231, 0.2);
}

textarea {
  resize: vertical;
  min-height: 100px;
  line-height: 1.5;
}

select option {
  background: var(--card);
  color: var(--text-primary);
}

input[type=range] {
  width: 100%;
  accent-color: var(--accent);
  background: transparent;
  border: none;
  padding: 0;
  height: 6px;
}

button {
  width: 100%;
  padding: 11px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: all 0.3s ease;
  text-transform: uppercase;
}

.btn-p {
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  color: #fff;
  box-shadow: 0 8px 24px rgba(108, 92, 231, 0.35);
  border: 1px solid rgba(108, 92, 231, 0.5);
}

.btn-p:hover {
  box-shadow: 0 12px 32px rgba(108, 92, 231, 0.55);
  transform: translateY(-2px);
}

.btn-p:disabled {
  opacity: 0.5;
  transform: none;
  cursor: wait;
}

.btn-s {
  background: rgba(26, 26, 46, 0.6);
  color: var(--text-primary);
  border: 1px solid var(--border);
}

.btn-s:hover {
  background: rgba(108, 92, 231, 0.15);
  border-color: var(--accent);
}

.btn-s:disabled {
  opacity: 0.5;
  cursor: wait;
}

.btn-g {
  background: rgba(38, 222, 129, 0.12);
  color: var(--success);
  border: 1px solid rgba(38, 222, 129, 0.3);
}

.btn-g:hover {
  background: rgba(38, 222, 129, 0.22);
}

.btn-g:disabled {
  opacity: 0.5;
  cursor: wait;
}

.algo-row {
  display: flex;
  gap: 6px;
}

.algo-btn {
  flex: 1;
  padding: 9px 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: rgba(26, 26, 46, 0.4);
  color: var(--text-secondary);
  font-size: 11px;
  cursor: pointer;
  text-align: center;
  transition: all 0.3s ease;
  letter-spacing: 0.5px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  text-transform: uppercase;
}

.algo-btn:hover {
  background: rgba(108, 92, 231, 0.1);
  border-color: var(--accent);
}

.algo-btn.on {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(108, 92, 231, 0.2);
  box-shadow: 0 0 12px rgba(108, 92, 231, 0.25);
}

.legend {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.leg-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--text-secondary);
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 8px currentColor;
}

/* ── RESULTS ── */
.results {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rcard {
  background: rgba(26, 26, 46, 0.4);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  animation: fadeUp 0.25s ease;
  transition: all 0.3s ease;
  cursor: pointer;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.rcard:hover {
  border-color: var(--accent);
  background: rgba(108, 92, 231, 0.1);
  box-shadow: 0 6px 20px rgba(108, 92, 231, 0.15);
  transform: translateY(-2px);
}

.rrank {
  font-size: 10px;
  color: var(--text-secondary);
  letter-spacing: 1px;
  margin-bottom: 4px;
  text-transform: uppercase;
}

.rmeta {
  font-size: 12px;
  line-height: 1.5;
  margin-bottom: 8px;
  color: var(--text-primary);
}

.rfoot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.rcat {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.5px;
  background: rgba(38, 222, 129, 0.12);
  color: var(--success);
  text-transform: uppercase;
  font-weight: 500;
}

.rdist {
  font-size: 10px;
  color: var(--text-secondary);
  flex: 1;
  text-align: right;
  font-family: 'Fira Code', monospace;
}

.del {
  background: rgba(238, 90, 111, 0.12);
  color: var(--error);
  border: 1px solid rgba(238, 90, 111, 0.25);
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  padding: 4px 10px;
  font-family: inherit;
  transition: all 0.3s ease;
  width: auto;
  text-transform: uppercase;
  font-weight: 500;
}

.del:hover {
  background: rgba(238, 90, 111, 0.25);
  box-shadow: 0 0 12px rgba(238, 90, 111, 0.2);
}

/* ── LATENCY / BENCH / LAYERS ── */
.lat-big {
  font-size: 36px;
  font-weight: 700;
  color: var(--primary);
  text-shadow: 0 0 24px rgba(0, 217, 255, 0.3);
  font-family: 'Fira Code', monospace;
}

.lat-sub {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.bench {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.brow {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.blabel {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
}

.btrack {
  height: 8px;
  background: rgba(26, 26, 46, 0.6);
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.bfill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s ease;
  background: linear-gradient(90deg, var(--accent), var(--primary));
  box-shadow: 0 0 12px rgba(108, 92, 231, 0.4);
}

.layers {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.lrow {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
}

.lnum {
  width: 20px;
  text-align: right;
  color: var(--accent);
  font-weight: 600;
}

.ltrack {
  flex: 1;
  height: 5px;
  background: rgba(26, 26, 46, 0.6);
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.lfill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #b388ff);
  border-radius: 2px;
  opacity: 0.8;
  transition: width 0.4s;
  box-shadow: 0 0 8px rgba(108, 92, 231, 0.3);
}

.lcount {
  width: 80px;
  text-align: right;
  color: var(--text-secondary);
  font-family: 'Fira Code', monospace;
}

#vecCvs {
  display: block;
  width: 100%;
  background: rgba(26, 26, 46, 0.3);
  border-radius: 8px;
  border: 1px solid var(--border);
}

/* ── DOCUMENT LIST ── */
.doc-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dcard {
  background: rgba(26, 26, 46, 0.4);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  animation: fadeUp 0.25s ease;
  transition: all 0.3s ease;
}

.dcard:hover {
  border-color: var(--success);
  background: rgba(38, 222, 129, 0.08);
}

.dcard-title {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--success);
}

.dcard-preview {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 8px;
}

.dcard-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.dcard-words {
  font-size: 10px;
  color: var(--text-tertiary);
  font-family: 'Fira Code', monospace;
}

/* ── OLLAMA STATUS ── */
.ollama-status {
  background: rgba(26, 26, 46, 0.4);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 11px;
  line-height: 1.6;
}

.ollama-status.ok {
  border-color: rgba(38, 222, 129, 0.4);
  background: rgba(38, 222, 129, 0.08);
}

.ollama-status.err {
  border-color: rgba(238, 90, 111, 0.4);
  background: rgba(238, 90, 111, 0.08);
}

/* ── CHAT ── */
.chat-history {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.chat-q {
  background: rgba(108, 92, 231, 0.15);
  border: 1px solid rgba(108, 92, 231, 0.3);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12px;
  line-height: 1.6;
}

.chat-a {
  background: rgba(26, 26, 46, 0.4);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}

.chat-a-label {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--success);
  margin-bottom: 8px;
  text-transform: uppercase;
  font-weight: 600;
}

.chat-a-text {
  font-size: 12px;
  line-height: 1.7;
  white-space: pre-wrap;
  color: var(--text-primary);
}

.chat-ctx {
  margin-top: 12px;
  border-top: 1px solid var(--border);
  padding-top: 10px;
}

.chat-ctx-label {
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  font-weight: 500;
}

.ctx-chip {
  display: inline-block;
  font-size: 10px;
  padding: 4px 9px;
  border-radius: 16px;
  margin: 2px 2px 2px 0;
  background: rgba(108, 92, 231, 0.15);
  border: 1px solid rgba(108, 92, 231, 0.3);
  color: var(--accent);
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 500;
}

.ctx-chip:hover {
  background: rgba(108, 92, 231, 0.25);
  box-shadow: 0 0 12px rgba(108, 92, 231, 0.2);
}

.ctx-expand {
  display: none;
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-top: 8px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.2);
  border-radius: 6px;
  border-left: 2px solid var(--accent);
}

.thinking {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-secondary);
}

.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.typing::after {
  content: '▋';
  animation: blink 1s step-end infinite;
  color: var(--accent);
}

@keyframes blink {
  50% { opacity: 0.3; }
}

/* ── TOOLTIP ── */
#tip {
  position: fixed;
  display: none;
  background: rgba(15, 15, 30, 0.95);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 11px;
  pointer-events: none;
  max-width: 240px;
  z-index: 200;
  line-height: 1.5;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(8px);
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar {
  width: 4px;
}

::-webkit-scrollbar-track {
  background: rgba(26, 26, 46, 0.3);
}

::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 2px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--accent);
}

/* ── ANIMATIONS ── */
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

header {
  animation: slideIn 0.4s ease;
}
</style>
</head>
<body>

<header>
  <h1>Vexora</h1>
  <span class="badge hl">HNSW</span>
  <span class="badge">KD-TREE</span>
  <span class="badge">BRUTE FORCE</span>
  <span class="badge" id="ollamaBadge">OLLAMA…</span>
  <span id="statsLabel">loading…</span>
</header>

<div class="layout">

  <!-- ══ LEFT PANEL ══ -->
  <div class="left-panel">
    <div>
      <div class="sec">Query (Demo Vectors)</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <input type="text" id="qInput" placeholder="binary tree, sushi, basketball…" />
        <button class="btn-p" onclick="runSearch()">⚡ SEARCH</button>
      </div>
    </div>
    <div>
      <div class="sec">Algorithm</div>
      <div class="algo-row">
        <div class="algo-btn on" data-algo="hnsw"      onclick="setAlgo(this)">HNSW</div>
        <div class="algo-btn"   data-algo="kdtree"     onclick="setAlgo(this)">KD-TREE</div>
        <div class="algo-btn"   data-algo="bruteforce" onclick="setAlgo(this)">BRUTE</div>
      </div>
    </div>
    <div>
      <div class="sec">Distance Metric</div>
      <select id="metric">
        <option value="cosine">Cosine Similarity</option>
        <option value="euclidean">Euclidean Distance</option>
        <option value="manhattan">Manhattan Distance</option>
      </select>
    </div>
    <div>
      <div class="sec">Top-K: <span id="kLabel">5</span></div>
      <input type="range" id="kSlider" min="1" max="10" value="5"
        oninput="document.getElementById('kLabel').textContent=this.value;debouncedSearch()">
    </div>
    <div>
      <div class="sec">EF (Efficiency):</div>
      <input type="range" id="efSlider" min="10" max="200" value="100"
        oninput="document.getElementById('efLabel').textContent=this.value;debouncedSearch()">
      <div style="font-size:10px;color:var(--text-secondary);margin-top:4px">
        Value: <span id="efLabel">100</span>
      </div>
    </div>
  </div>

  <!-- ══ CENTER PANEL ══ -->
  <div class="center-panel">
    <canvas id="scatter"></canvas>
  </div>

  <!-- ══ RIGHT PANEL ══ -->
  <div class="right-panel">
    <div class="tabs">
      <div class="tab on" onclick="switchTab(this, 'results')">RESULTS</div>
      <div class="tab" onclick="switchTab(this, 'bench')">PERFORMANCE</div>
      <div class="tab" onclick="switchTab(this, 'docs')">DOCUMENTS</div>
      <div class="tab" onclick="switchTab(this, 'rag')">RAG ASK</div>
    </div>

    <div class="tab-content on" id="results">
      <div class="results" id="resultList"></div>
    </div>

    <div class="tab-content" id="bench">
      <div class="lat-big" id="latency">—</div>
      <div class="lat-sub">Query Latency</div>
      <div class="bench" style="margin-top:16px" id="benchmarks"></div>
      <div style="margin-top:16px">
        <div class="sec">Layers Distribution</div>
        <div class="layers" id="layersList"></div>
      </div>
      <div style="margin-top:16px">
        <canvas id="vecCvs" width="200" height="120"></canvas>
      </div>
    </div>

    <div class="tab-content" id="docs">
      <div class="sec">Active Documents: <span id="docCountLabel">0</span></div>
      <div class="doc-list" id="docList"></div>
      <div style="margin-top:16px">
        <div class="sec">Add Document</div>
        <input type="text" id="docTitle" placeholder="Document title…" />
        <textarea id="docText" placeholder="Document content…" style="margin-top:8px"></textarea>
        <button class="btn-p" onclick="uploadDoc()" style="margin-top:8px">+ ADD DOCUMENT</button>
      </div>
      <div style="margin-top:16px">
        <div class="ollama-status" id="ollamaStatus">Checking Ollama status…</div>
      </div>
    </div>

    <div class="tab-content" id="rag">
      <div style="display:flex;flex-direction:column;gap:8px;height:100%">
        <input type="text" id="ragK" placeholder="Retrieval count…" value="3" />
        <textarea id="ragQuestion" placeholder="Ask your question…"></textarea>
        <button class="btn-p" id="askBtn" onclick="askAI()">🤖 ASK AI</button>
        <div class="chat-history" id="chatHistory" style="flex:1;overflow-y:auto"></div>
      </div>
    </div>
  </div>

</div>

<div id="tip"></div>

<script>
const API='http://localhost:5000';
let currentAlgo='hnsw',currentMetric='cosine';
let pcaPoints=[],allResults=[],hitIds=new Set(),queryPt=null;

// ════════════════════════════════════════════════════════════
//  CANVAS & RENDERING
// ════════════════════════════════════════════════════════════
const canvas=document.getElementById('scatter');
const ctx=canvas.getContext('2d',{alpha:true});
let animationId;

function resize(){
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width; canvas.height=rect.height;
}
window.addEventListener('resize',resize);

// Simplified color mapping
function getColor(item){
  const colors={
    math:'#b388ff', sports:'#69f0ae', food:'#ffb74d', cs:'#00d9ff'
  };
  return colors[item.category]||'#6c63ff';
}

function drawFrame(){
  ctx.fillStyle='rgba(10,10,20,0.05)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  
  // Draw background grid (subtle)
  ctx.strokeStyle='rgba(26,26,46,0.1)'; ctx.lineWidth=0.5;
  for(let i=0;i<canvas.width;i+=50){
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
  }
  for(let i=0;i<canvas.height;i+=50){
    ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
  }
  
  // Draw all points
  const scale=Math.min(canvas.width,canvas.height)/2.2;
  const cx=canvas.width/2, cy=canvas.height/2;
  
  pcaPoints.forEach(p=>{
    const x=cx+p.x*scale, y=cy+p.y*scale;
    const isHit=hitIds.has(p.item.id);
    const color=getColor(p.item);
    
    ctx.fillStyle=isHit?color:color+'40';
    ctx.beginPath(); ctx.arc(x,y,isHit?5.5:3,0,Math.PI*2);
    if(isHit){
      ctx.shadowColor=color; ctx.shadowBlur=12;
    }
    ctx.fill(); ctx.shadowBlur=0;
  });
  
  // Draw query point
  if(queryPt){
    const x=cx+queryPt.x*scale, y=cy+queryPt.y*scale;
    ctx.fillStyle='#00d9ff'; ctx.globalAlpha=0.8;
    ctx.beginPath(); ctx.moveTo(x-8,y); ctx.lineTo(x+8,y); ctx.moveTo(x,y-8); ctx.lineTo(x,y+8);
    ctx.strokeStyle='#00d9ff'; ctx.lineWidth=2;
    ctx.stroke(); ctx.globalAlpha=1;
    ctx.shadowColor='#00d9ff'; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2);
    ctx.stroke(); ctx.shadowBlur=0;
  }
  
  animationId=requestAnimationFrame(drawFrame);
}

// ════════════════════════════════════════════════════════════
//  MAIN SEARCH
// ════════════════════════════════════════════════════════════
function textToEmbedding(text){
  let hash=0;
  for(let i=0;i<text.length;i++){
    const ch=text.charCodeAt(i); hash=((hash<<5)-hash)+ch; hash=hash&hash;
  }
  const v=[];
  for(let i=0;i<16;i++) v.push((Math.sin(hash*0.01+i)*0.5+0.5)*2-1);
  return v;
}

async function runSearch(){
  const q=document.getElementById('qInput').value.trim();
  if(!q)return;
  const v=textToEmbedding(q);
  const metric=currentMetric;
  const algo=currentAlgo;
  const k=parseInt(document.getElementById('kSlider').value);
  const ef=parseInt(document.getElementById('efSlider').value);
  
  try{
    const r=await fetch(`${API}/search?v=${v.join(',')}&k=${k}&metric=${metric}&algo=${algo}&ef=${ef}`);
    const d=await r.json();
    
    hitIds=new Set(); let minDist=Infinity,maxDist=0;
    if(d.results&&d.results.length>0){
      allResults=d.results;
      d.results.forEach(res=>{hitIds.add(res.id);minDist=Math.min(minDist,res.distance);maxDist=Math.max(maxDist,res.distance);});
    }
    
    const lat=d.latency_ms||0;
    document.getElementById('latency').textContent=lat.toFixed(1)+'ms';
    
    displayResults(d.results||[]);
    
    if(d.benchmarks){
      document.getElementById('benchmarks').innerHTML=d.benchmarks.map((b,i)=>
        `<div class="brow"><div class="blabel"><span>${b.name}</span><span>${b.value}</span></div>`+
        `<div class="btrack"><div class="bfill" style="width:${Math.min(100,b.value/10)}%"></div></div></div>`
      ).join('');
    }
    
    if(d.layers){ updateLayers(d.layers); }
    
  }catch(e){console.error(e);}
}

function displayResults(results){
  if(!results.length){
    document.getElementById('resultList').innerHTML='<div style="color:var(--text-secondary);font-size:11px">No results found.</div>';
    return;
  }
  document.getElementById('resultList').innerHTML=results.map((r,i)=>
    `<div class="rcard">
      <div class="rrank">#${i+1}</div>
      <div class="rmeta">${r.text}</div>
      <div class="rfoot">
        <span class="rcat">${r.category}</span>
        <span class="rdist">dist: ${r.distance.toFixed(4)}</span>
      </div>
    </div>`
  ).join('');
}

// ════════════════════════════════════════════════════════════
//  UI INTERACTIONS
// ════════════════════════════════════════════════════════════
let searchTimeout;
function debouncedSearch(){
  clearTimeout(searchTimeout);
  searchTimeout=setTimeout(runSearch,200);
}

function setAlgo(el){
  document.querySelectorAll('.algo-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  currentAlgo=el.dataset.algo;
  runSearch();
}

function switchTab(tab,contentId){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('on'));
  tab.classList.add('on');
  document.getElementById(contentId).classList.add('on');
}

document.getElementById('metric').addEventListener('change',(e)=>{
  currentMetric=e.target.value;
  runSearch();
});

// ════════════════════════════════════════════════════════════
//  INITIALIZATION
// ════════════════════════════════════════════════════════════
async function loadItems(){
  try{
    const r=await fetch(API+'/items'), d=await r.json();
    pcaPoints=d.points||[];
    document.getElementById('statsLabel').textContent=`${pcaPoints.length} vectors`;
  }catch(e){console.error(e);}
}

async function loadHNSW(){
  try{
    const r=await fetch(API+'/graph');
    const d=await r.json();
  }catch(e){console.error(e);}
}

function updateLayers(layers){
  const html=layers.map((l,i)=>
    `<div class="lrow"><div class="lnum">${i}</div><div class="ltrack"><div class="lfill" style="width:${Math.min(100,l*10)}%"></div></div><div class="lcount">${l}</div></div>`
  ).join('');
  document.getElementById('layersList').innerHTML=html;
}

async function checkOllamaStatus(){
  try{
    const r=await fetch(API+'/ollama/status'), d=await r.json();
    const status=document.getElementById('ollamaStatus');
    if(d.status==='ok'){
      status.className='ollama-status ok';
      status.innerHTML='✓ Ollama connected & ready';
    }else{
      status.className='ollama-status err';
      status.innerHTML='✗ Ollama unavailable';
    }
  }catch(e){
    document.getElementById('ollamaStatus').className='ollama-status err';
    document.getElementById('ollamaStatus').innerHTML='✗ Cannot connect to backend';
  }
}

async function uploadDoc(){
  const title=document.getElementById('docTitle').value.trim();
  const text=document.getElementById('docText').value.trim();
  if(!title||!text)return;
  
  try{
    const r=await fetch(API+'/doc/add',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title,text})
    });
    const d=await r.json();
    document.getElementById('docTitle').value='';
    document.getElementById('docText').value='';
    loadDocList();
  }catch(e){console.error(e);}
}

async function loadDocList(){
  try{
    const r=await fetch(API+'/doc/list'), docs=await r.json();
    document.getElementById('docCountLabel').textContent=docs.length;
    if(!docs.length){
      document.getElementById('docList').innerHTML='<div style="color:var(--text-secondary);font-size:11px">No documents yet.</div>';
      return;
    }
    document.getElementById('docList').innerHTML=docs.map(d=>`
      <div class="dcard">
        <div class="dcard-title">${d.title}</div>
        <div class="dcard-preview">${d.preview}</div>
        <div class="dcard-foot">
          <span class="dcard-words">${d.words} words</span>
          <button class="del" onclick="deleteDoc(${d.id})">✕</button>
        </div>
      </div>`).join('');
  }catch(_){}
}

async function deleteDoc(id){
  try{
    await fetch(`${API}/doc/delete/${id}`,{method:'DELETE'});
    loadDocList();checkOllamaStatus();
  }catch(_){}
}

// ════════════════════════════════════════════════════════════
//  RAG  — Ask AI
// ════════════════════════════════════════════════════════════
document.getElementById('ragQuestion').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.ctrlKey)askAI();
});

async function askAI(){
  const question=document.getElementById('ragQuestion').value.trim();
  if(!question)return;
  const k=parseInt(document.getElementById('ragK').value);
  const btn=document.getElementById('askBtn');
  btn.disabled=true;btn.textContent='Thinking…';
  
  const history=document.getElementById('chatHistory');
  history.innerHTML='';
  
  const qDiv=document.createElement('div');qDiv.className='chat-q';
  qDiv.textContent=question;history.appendChild(qDiv);
  
  const thinkDiv=document.createElement('div');thinkDiv.className='thinking';
  thinkDiv.innerHTML='<div class="spinner"></div>Retrieving context & generating answer…';
  history.appendChild(thinkDiv);
  history.scrollTop=history.scrollHeight;
  
  fetch(API+'/doc/search',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({question,k})
  })
  .then(res=>res.json())
  .then(data=>{
    if(data.contexts&&data.contexts.length>0){
      hitIds=new Set();
      let sx=0,sy=0,sw=0;
      data.contexts.forEach((ctx,i)=>{
        const pt=pcaPoints.find(p=>p.item.category==='doc'&&ctx.title.startsWith(p.item.metadata));
        if(pt){hitIds.add(pt.item.id);const w=1/(i+1);sx+=pt.x*w;sy+=pt.y*w;sw+=w;}
      });
      if(sw>0)queryPt={x:sx/sw+(Math.random()-.5)*.015,y:sy/sw+(Math.random()-.5)*.015};
    }else{
      hitIds=new Set();
      const emb16=textToEmbedding(question);
      fetch(`${API}/search?v=${emb16.join(',')}&k=3&metric=cosine&algo=hnsw`)
        .then(res2=>res2.json())
        .then(data2=>{
          if(data2.results&&data2.results.length>0){
            let sx=0,sy=0,sw=0;
            for(let i=0;i<Math.min(3,data2.results.length);i++){
              const pt=pcaPoints.find(p=>p.item.id===data2.results[i].id);
              if(pt){const w=1/(i+1);sx+=pt.x*w;sy+=pt.y*w;sw+=w;}
            }
            if(sw>0)queryPt={x:sx/sw+(Math.random()-.5)*.015,y:sy/sw+(Math.random()-.5)*.015};
          }
        }).catch(()=>{});
    }
  }).catch(()=>{});
  
  try{
    const r=await fetch(API+'/doc/ask',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question,k})
    });
    const d=await r.json();
    thinkDiv.remove();
    
    const aDiv=document.createElement('div');aDiv.className='chat-a';
    
    if(d.error){
      aDiv.innerHTML=`<div class="chat-a-label">ERROR</div><div class="chat-a-text" style="color:var(--error)">${d.error}</div>`;
    }else{
      aDiv.innerHTML=`<div class="chat-a-label">🤖 ${d.model||'llm'}</div>`+
        `<div class="chat-a-text" id="typeTarget"></div>`+
        `<div class="chat-ctx">`+
          `<div class="chat-ctx-label">RETRIEVED CONTEXT (${d.contexts.length} chunks)</div>`+
          d.contexts.map((c,i)=>`<span class="ctx-chip" onclick="toggleCtx(${i})">#${i+1} ${c.title} · ${c.distance.toFixed(3)}</span>`+
            `<div class="ctx-expand" id="ctx-${i}">${c.text}</div>`).join('')+
        `</div>`;
      history.appendChild(aDiv);
      
      const target=aDiv.querySelector('#typeTarget');
      target.classList.add('typing');
      const full=d.answer;let i=0;
      const timer=setInterval(()=>{
        if(i>=full.length){clearInterval(timer);target.classList.remove('typing');return;}
        const chunk=full.slice(i,i+3);target.textContent+=chunk;i+=3;
        history.scrollTop=history.scrollHeight;
      },18);
    }
    
    if(!d.error){}else history.appendChild(aDiv);
    
  }catch(e){
    thinkDiv.remove();
    const err=document.createElement('div');err.className='chat-a';
    err.innerHTML='<div class="chat-a-label">ERROR</div><div class="chat-a-text" style="color:var(--error)">Server error — is the backend running?</div>';
    history.appendChild(err);
  }
  
  document.getElementById('ragQuestion').value='';
  btn.disabled=false;btn.textContent='🤖 ASK AI';
  history.scrollTop=history.scrollHeight;
}

function toggleCtx(i){
  const el=document.getElementById('ctx-'+i);
  el.style.display=el.style.display==='block'?'none':'block';
}

// ════════════════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════════════════
resize();drawFrame();
loadItems().then(loadHNSW);
checkOllamaStatus();
</script>
</body>
</html>
